name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: windows-amd64
            wails_platform: windows/amd64
            artifact_file: hf-downloader-windows-amd64.zip
          - os: macos-latest
            platform_name: macos-universal
            wails_platform: darwin/universal
            artifact_file: hf-downloader-macos-universal.zip
          - os: ubuntu-latest
            platform_name: linux-amd64
            wails_platform: linux/amd64
            artifact_file: hf-downloader-linux-amd64.tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev || sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Determine Version & Commit
        id: vars
        shell: bash
        run: |
          VERSION="1.0.0"
          if [ -f "VERSION" ]; then
            VERSION=$(cat VERSION | tr -d ' \r\n')
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          COMMIT="${GITHUB_SHA::8}"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Build Application with Wails
        run: >
          wails build
          -platform ${{ matrix.wails_platform }}
          -ldflags "-s -w -X hf-downloader/internal/version.Version=${{ steps.vars.outputs.version }} -X hf-downloader/internal/version.GitCommit=${{ steps.vars.outputs.commit }} -X hf-downloader/internal/version.BuildDate=${{ steps.vars.outputs.build_date }}"

      - name: Package Windows Binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build\bin\hf-downloader.exe -DestinationPath ${{ matrix.artifact_file }}
          $hash = (Get-FileHash -Path ${{ matrix.artifact_file }} -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact_file }}" | Out-File -Encoding ascii -FilePath "${{ matrix.artifact_file }}.sha256"

      - name: Package macOS Application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd build/bin
          zip -r ../../${{ matrix.artifact_file }} hf-downloader.app
          cd ../..
          shasum -a 256 ${{ matrix.artifact_file }} > ${{ matrix.artifact_file }}.sha256

      - name: Package Linux Binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czvf ${{ matrix.artifact_file }} -C build/bin hf-downloader
          sha256sum ${{ matrix.artifact_file }} > ${{ matrix.artifact_file }}.sha256

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform_name }}
          path: |
            ${{ matrix.artifact_file }}
            ${{ matrix.artifact_file }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display Release Files
        run: |
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
